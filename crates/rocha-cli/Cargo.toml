[package]
name = "rocha-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "rocha"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }
rocha-config = { path = "../rocha-config" }
rocha-transform = { path = "../rocha-transform" }
rocha-discover = { path = "../rocha-discover" }
rocha-protocol = { path = "../rocha-protocol" }
rocha-worker = { path = "../rocha-worker" }
rocha-sched = { path = "../rocha-sched" }
rocha-report = { path = "../rocha-report" }
rayon.workspace = true
serde_json.workspace = true
base64-simd = "0.8.0"
