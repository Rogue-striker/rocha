[workspace]
resolver = "2"
members = [
    "crates/rocha-cli",
    "crates/rocha-config",
    "crates/rocha-discover",
    "crates/rocha-transform",
    "crates/rocha-protocol",
    "crates/rocha-worker",
    "crates/rocha-sched",
    "crates/rocha-report",
    "crates/rocha-watch",
]

[workspace.package]
version = "2.5.13"
edition = "2021"
authors = ["rogue-striker"]
license = "MIT"
repository = "https://github.com/Rogue-striker/rocha"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
rayon = "1.10"
boa_engine = "0.22.0"

[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
rust-toolchain-version = "stable"
ci = "github"
installers = ["shell", "powershell", "npm"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
