[workspace]
resolver = "2"
members = [
    "crates/rocha-cli",
    "crates/rocha-config",
    "crates/rocha-discover",
    "crates/rocha-transform",
    "crates/rocha-protocol",
    "crates/rocha-worker",
    "crates/rocha-sched",
    "crates/rocha-report",
    "crates/rocha-watch",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rocha Contributors"]
license = "MIT"
repository = "https://github.com/rocha-runner/rocha"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
rayon = "1.10"
